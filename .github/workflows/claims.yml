name: Claims
# Labels and comments on pull requests that claim requests for work: the earliest open pull request for an item holds the
# claim, later ones are marked duplicate, and drafts lapse after 72 hours without a commit. See CONTRIBUTING.md.
on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft, closed]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
  pull-requests: write
concurrency:
  group: claims
  cancel-in-progress: false
jobs:
  claims:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # pull_request_target checks out the base branch here, never the pull request. This job can write labels and
      # comments, so it must not run code from a pull request.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/github-script@v7
        with:
          script: |
            const bot = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/claims.cjs`);
            await bot.run({ github, context, core });
