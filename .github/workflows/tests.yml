name: Inventory and evidence checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test list filtering and map framing
        run: node --test tests/frontend_evidence.test.cjs
      - name: Rebuild saved public evidence
        env:
          OBS_FILE: data/observations_all.csv
          REJ_FILE: data/rejections_all.csv
          RESULTS_DIR: results_gee
        run: |
          python build_site.py
          python build_timeline_data.py
          python build_status.py
          python tools/validate_epoch.py
